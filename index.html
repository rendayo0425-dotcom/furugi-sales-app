<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古着販売 売上登録アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ページ全体を中央に配置するための入れ物です -->
  <main class="app">
    <!-- アプリの見出しです -->
    <header class="page-header">
      <h1>古着販売 売上登録</h1>
      <p class="lead">販売した商品を登録して、利益と利益率を一覧で確認できます。</p>
    </header>

    <!-- 表示する月を選ぶカードです -->
    <section class="card">
      <label for="monthFilter">
        表示する月
        <input id="monthFilter" class="field" type="month" required>
      </label>
    </section>

    <!-- 一覧の検索・絞り込み・並び替えを行う表示設定です -->
    <section class="card filter-card" data-section-id="filters">
      <div class="section-header">
        <h2>表示設定</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>
      <div class="section-content">
      <div class="filter-grid">
        <label for="searchInput">
          商品名・メモ検索
          <input id="searchInput" class="field" type="search" placeholder="キーワードを入力">
        </label>

        <label for="channelFilter">
          販路で絞り込み
          <select id="channelFilter" class="field">
            <option value="all">すべて</option>
            <option value="メルカリメイン">メルカリメイン</option>
            <option value="メルカリサブ">メルカリサブ</option>
            <option value="ヤフー">ヤフー</option>
            <option value="ラクマ">ラクマ</option>
          </select>
        </label>

        <label for="sortSelect">
          並び替え
          <select id="sortSelect" class="field">
            <option value="dateDesc">販売日が新しい順</option>
            <option value="dateAsc">販売日が古い順</option>
            <option value="priceDesc">売値が高い順</option>
            <option value="profitDesc">利益が高い順</option>
            <option value="profitRateDesc">利益率が高い順</option>
          </select>
        </label>
      </div>
      </div>
    </section>

    <!-- CSVの出力と読み込みを行う管理メニューです -->
    <section class="card csv-card" data-section-id="csv">
      <div class="section-header">
        <h2>データ管理</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>

      <div class="section-content">
      <div class="csv-actions">
        <button id="exportCsvButton" type="button">CSV出力</button>

        <div class="csv-import-box">
          <label for="csvFileInput">
            CSV読み込み
            <input id="csvFileInput" class="field file-field" type="file" accept=".csv,text/csv">
          </label>

          <!-- 読み込み時に、今のデータへ追加するか置き換えるかを選びます -->
          <div class="import-mode">
            <label>
              <input type="radio" name="importMode" value="append" checked>
              現在のデータに追加する
            </label>
            <label>
              <input type="radio" name="importMode" value="replace">
              現在のデータを置き換える
            </label>
          </div>
        </div>
      </div>
      </div>
    </section>

    <!-- 登録済みデータを月ごとにまとめたサマリーです -->
    <section class="card monthly-summary-card" data-section-id="monthlySummary">
      <div class="section-header">
        <h2>月別サマリー</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>
      <div class="section-content">
      <label for="summaryYearSelect" class="summary-year-control">
        年度
        <select id="summaryYearSelect" class="field"></select>
      </label>

      <!-- JavaScriptで月別サマリーカードをここに追加します -->
      <div id="monthlySummaryList" class="monthly-summary-list"></div>
      </div>
    </section>

    <!-- 選択中の月の全体集計を表示するカードです -->
    <section class="card summary-card" data-section-id="totalSummary">
      <div class="section-header">
        <h2>全体集計</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>
      <div class="section-content">
      <div class="summary-grid">
        <div class="summary-box">
          <span>売上合計</span>
          <strong id="totalSales">0円</strong>
        </div>
        <div class="summary-box">
          <span>原価合計</span>
          <strong id="totalCost">0円</strong>
        </div>
        <div class="summary-box">
          <span>送料合計</span>
          <strong id="totalShipping">0円</strong>
        </div>
        <div class="summary-box">
          <span>手数料合計</span>
          <strong id="totalFee">0円</strong>
        </div>
        <div class="summary-box">
          <span>利益合計</span>
          <strong id="totalProfit">0円</strong>
        </div>
        <div class="summary-box">
          <span>平均利益率</span>
          <strong id="averageProfitRate">0.0%</strong>
        </div>
        <div class="summary-box">
          <span>登録件数</span>
          <strong id="summaryCount">0件</strong>
        </div>
      </div>
      </div>
    </section>

    <!-- 選択中の月の販路別集計を表示するカードです -->
    <section class="card channel-summary-card" data-section-id="channelSummary">
      <div class="section-header">
        <h2>販路別集計</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>
      <div class="section-content">
      <div id="channelSummaryList" class="channel-summary-list"></div>
      </div>
    </section>

    <!-- 売上を入力するカードです -->
    <section class="card" data-section-id="salesForm">
      <div class="section-header">
        <h2 id="formTitle">売上を登録</h2>
        <button class="section-toggle" type="button">− しまう</button>
      </div>
      <div class="section-content">
      <p id="editStatus" class="edit-status">編集中です。内容を変更して「更新する」を押してください。</p>

      <!-- 入力フォームです。JavaScriptで登録と計算を行います -->
      <form id="salesForm" class="form">
        <label for="saleDate">
          販売日
          <input id="saleDate" class="field" type="date" required>
        </label>

        <label for="salesChannel">
          販路
          <select id="salesChannel" class="field" required>
            <option value="メルカリメイン">メルカリメイン</option>
            <option value="メルカリサブ">メルカリサブ</option>
            <option value="ヤフー">ヤフー</option>
            <option value="ラクマ">ラクマ</option>
          </select>
        </label>

        <label for="itemName">
          商品名
          <input id="itemName" class="field" type="text" placeholder="例: Levi's デニムジャケット" required>
        </label>

        <label for="itemImage">
          商品画像
          <!-- 画像だけを選べるファイル入力です。画像なしでも登録できます -->
          <input id="itemImage" class="field file-field" type="file" accept="image/*">
        </label>

        <!-- 画像を選んだときだけ、登録前のプレビューを表示します -->
        <div id="imagePreviewWrap" class="image-preview-wrap">
          <img id="imagePreview" class="image-preview" alt="選択した商品画像のプレビュー">
        </div>

        <label for="salePrice">
          売値
          <span class="input-wrap">
            <input id="salePrice" type="number" min="0" step="1" placeholder="例: 3500" required>
            <span>円</span>
          </span>
        </label>

        <label for="costPrice">
          仕入れ値
          <span class="input-wrap">
            <input id="costPrice" type="number" min="0" step="1" placeholder="例: 1200" required>
            <span>円</span>
          </span>
        </label>

        <label for="shippingFee">
          送料
          <span class="input-wrap">
            <input id="shippingFee" type="number" min="0" step="1" placeholder="例: 750" required>
            <span>円</span>
          </span>
        </label>

        <label for="feeRate">
          販売手数料率
          <span class="input-wrap">
            <input id="feeRate" type="number" min="0" step="0.1" value="10" required>
            <span>%</span>
          </span>
        </label>

        <label for="memo">
          メモ
          <textarea id="memo" class="field" rows="3" placeholder="例: 目立つ汚れなし、宅急便コンパクト"></textarea>
        </label>

        <div class="form-actions">
          <button id="submitButton" type="submit">登録する</button>
          <!-- 編集中だけ表示するキャンセルボタンです -->
          <button id="cancelEditButton" class="cancel-button" type="button">キャンセル</button>
        </div>
      </form>
      </div>
    </section>

    <!-- 登録済みの商品を表示するカードです -->
    <section class="card" data-section-id="salesList">
      <div class="section-header">
        <h2>登録済み一覧</h2>
        <div class="section-header-actions">
          <span id="itemCount">0件</span>
          <button class="section-toggle" type="button">− しまう</button>
        </div>
      </div>

      <div class="section-content">
      <!-- JavaScriptで商品カードをここに追加します -->
      <div id="salesList" class="sales-list"></div>

      <!-- 登録データがないときだけ表示します -->
      <p id="emptyMessage" class="empty-message">選択中の月に登録された商品はありません。</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
